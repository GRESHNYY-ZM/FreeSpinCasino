name: Build FreeSpinCasino APK
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check and extract Android project
        shell: bash
        run: |
          set -euo pipefail
          unzip -t FreeSpinCasino-2.1.1-repaired.zip
          unzip -q -o FreeSpinCasino-2.1.1-repaired.zip -d .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/java/com/freespin/casino/MainActivity.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeSpinCasino-2.1.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
