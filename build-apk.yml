name: Build FreeSpinCasino 3.0

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          # Prefer a Gradle project already present in the repository.
          if [[ -f "./settings.gradle.kts" && -d "./app" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [[ -f "./FreeSpinCasino-3.0-Arcade/settings.gradle.kts" && -d "./FreeSpinCasino-3.0-Arcade/app" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/FreeSpinCasino-3.0-Arcade"
          else
            # Find a ZIP archive regardless of its exact filename or subfolder.
            ARCHIVE="$(find "$GITHUB_WORKSPACE"               -type f -iname '*.zip'               -not -path '*/.git/*'               -not -path '*/build/*'               -print -quit)"

            if [[ -z "${ARCHIVE:-}" ]]; then
              echo "::error::No Android project or ZIP archive found. Upload the project folder or its ZIP to the repository."
              exit 1
            fi

            echo "Using source archive: $ARCHIVE"
            mkdir -p "$RUNNER_TEMP/freespin-source"
            unzip -o "$ARCHIVE" -d "$RUNNER_TEMP/freespin-source"

            # Locate the folder that actually contains settings.gradle(.kts) and app/.
            SETTINGS="$(find "$RUNNER_TEMP/freespin-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [[ -z "$SETTINGS" ]]; then
              echo "::error::ZIP was extracted, but no settings.gradle or settings.gradle.kts was found."
              find "$RUNNER_TEMP/freespin-source" -maxdepth 4 -type f | head -80
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          if [[ ! -d "$PROJECT_DIR/app" ]]; then
            echo "::error::Android app module folder not found in: $PROJECT_DIR"
            exit 1
          fi

          echo "Building project from: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeSpinCasino-3.0-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
